<!doctype html><html><meta charset="utf-8"><title>Yahoo parser checks</title><h1 id="result">Running</h1><pre id="details"></pre><script src="../browser-extension/parser.js"></script><script>
const results=[];
function check(name,f){try{f();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}}
function assert(c,m){if(!c)throw Error(m)}
function parse(html,url='https://basketball.fantasysports.yahoo.com/nba/123/draftresults'){return NBAParser.parse(new DOMParser().parseFromString(html,'text/html'),url)}
const round=(n,rows)=>`<table><thead><tr><th colspan="3">Round ${n}</th></tr></thead><tbody>${rows.map(([i,id,name,team])=>`<tr><td>${i}.</td><td class="player"><a href="https://sports.yahoo.com/nba/players/${id}">${name}</a></td><td>${team}</td></tr>`).join('')}</tbody></table>`;
check('round positions become overall picks and reverse team mapping stays explicit',()=>{const r=parse(round(1,[[1,1,'A','X'],[2,2,'B','Y']])+round(2,[[1,3,'C','Y'],[2,4,'D','X']]));assert(r.picks[2].pick===3,'wrong overall');assert(r.picks[2].team==='Y','wrong owner');assert(r.draft_teams===2,'wrong teams')});
check('previous season is marked historical',()=>{assert(parse('<select id="yfa-draftresults-select"><option selected>2025 season draft results</option></select>', 'https://basketball.fantasysports.yahoo.com/nba/123/draftresults?draft_results_period=previous').historical,'old season accepted')});
check('scheduled draft has no invented picks',()=>{const r=parse('<div class="yfa-draft-scheduled">Draft scheduled</div>');assert(r.picks.length===0&&r.draft_status==='Draft scheduled','invented picks')});
check('Yahoo rank is not ADP',()=>{const r=parse('<table><thead><tr><th>Pre-Season</th></tr></thead><tbody><tr><td><a href="https://sports.yahoo.com/nba/players/1">A</a>1</td></tr></tbody></table>');assert(r.adp.length===0,'rank used as adp')});
check('displayed Avg Pick parsed without notes or unrelated links',()=>{const r=parse('<table><thead><tr><th>Player</th><th>Avg Pick</th></tr></thead><tbody><tr><td><a href="https://sports.yahoo.com/nba/players/1">A</a><a href="https://sports.yahoo.com/nba/players/1/news">Note</a></td><td>2.7</td></tr></tbody></table>');assert(r.adp[0].ADP_AVG===2.7&&r.adp[0].PLAYER==='A','bad adp')});
check('Yahoo Action header colspan keeps Avg Pick aligned',()=>{const r=parse('<table><thead><tr><th colspan="2">Action</th><th>Player</th><th>Avg Pick</th></tr></thead><tbody><tr><td>watch</td><td>add</td><td><a href="https://sports.yahoo.com/nba/players/1">A</a></td><td>8.4</td></tr></tbody></table>');assert(r.adp[0].ADP_AVG===8.4,'misaligned ADP')});
check('live results use visible player IDs and overall picks, strip auth query',()=>{const r=parse('<table><thead><tr><th>Pick</th><th>Player</th><th>Team</th></tr></thead><tbody><tr><td>22</td><td><div class="ys-player" data-id="6000"><img title="A. Player"></div></td><td>Your Team</td></tr></tbody></table>','https://basketball.fantasysports.yahoo.com/draftclient/nba/456/3?auth=not-a-real-token');assert(r.live&&r.picks[0].pick===22&&r.picks[0].player_id==='6000'&&r.picks[0].team==='__OUR_TEAM__','wrong live mapping');assert(!r.source_url.includes('auth'),'auth leaked')});
check('live displayed ADP and projection statistics need no uploaded board',()=>{const r=parse('<select><option selected>2026-27 Proj Stats</option></select><table><thead><tr><th>Player</th><th>ADP</th><th>FG%</th><th>FT%</th><th>3PTM</th><th>PTS</th><th>REB</th><th>AST</th><th>ST</th><th>BLK</th><th>TO</th><th>GP</th></tr></thead><tbody><tr><td><div class="ys-player" data-id="6000"><img title="A. Player"></div></td><td>7.5</td><td>.5</td><td>.8</td><td>100</td><td>1000</td><td>500</td><td>300</td><td>50</td><td>25</td><td>100</td><td>70</td></tr></tbody></table>','https://basketball.fantasysports.yahoo.com/draftclient/nba/456/3');assert(r.adp[0].ADP_AVG===7.5&&r.players[0].PTS===1000&&r.players[0].GP===70,'bad live stats')});
check('live clock derives next snake slot without manual input',()=>{const r=parse('<p>You\'re up in 17 Picks · Round 1, Pick 5</p>','https://basketball.fantasysports.yahoo.com/draftclient/nba/123/9');assert(r.current_pick===5&&r.draft_slot===3,'wrong clock or slot')});
check('unknown units remain unknown rather than fabricated averages',()=>{const r=parse('<table><thead><tr><th>Player</th><th>PTS</th><th>FG%</th></tr></thead><tbody><tr><td><div class="ys-player" data-id="3"><img title="Synthetic"></div></td><td>25</td><td>.5</td></tr></tbody></table>','https://basketball.fantasysports.yahoo.com/draftclient/nba/123/9');assert(r.players[0].STAT_BASIS==='unknown','unknown units inferred')});
check('remaining-game projections preserve totals and comma-separated shot volumes',()=>{const r=parse('<select id="statselect"><option selected value="S_PSR">Remaining Games (proj)</option></select><table><thead><tr><th>Player</th><th>GP*</th><th>FGM/A*</th><th>FG%</th><th>PTS</th></tr></thead><tbody><tr><td><a href="https://sports.yahoo.com/nba/players/3">Synthetic</a></td><td>71</td><td>736/1,283</td><td>.574</td><td>1,978</td></tr></tbody></table>','https://basketball.fantasysports.yahoo.com/nba/123/players');assert(r.players[0].FGA===1283&&r.players[0].PTS===1978&&r.players[0].STAT_BASIS==='season_total','wrong total units')});
check('prior-season statistic metadata stays explicit',()=>{const r=parse('<select id="statselect"><option selected value="S_AS_2025">2025-26 Season (avg)</option></select><table><thead><tr><th>Player</th><th>PTS</th><th>FG%</th></tr></thead><tbody><tr><td><a href="https://sports.yahoo.com/nba/players/3">Synthetic</a></td><td>25</td><td>.5</td></tr></tbody></table>','https://basketball.fantasysports.yahoo.com/nba/123/players');assert(r.players[0].STAT_SEASON===2025&&r.players[0].STAT_BASIS==='per_game','lost historical metadata')});
check('duplicate draft client logout is a connection failure not a fresh result',()=>{const r=parse('<p>You have been logged off because you logged in from another draft client.</p>','https://basketball.fantasysports.yahoo.com/draftclient/nba/123/9');assert(r.connection_error&&r.picks.length===0&&!r.results_visible,'logout accepted as fresh results')});
check('round two overall pick is read instead of retaining round one clock',()=>{const u='https://basketball.fantasysports.yahoo.com/draftclient/nba/123/9';assert(parse('<p>You\'re up in 0 Picks Round 2, Pick 18</p>',u).current_pick===18,'overall clock dropped');assert(parse('<p>Round 2 · Pick 6</p>',u).current_pick===18,'within-round clock wrong');assert(!parse('<p>Round 2, Pick 99</p>',u).current_pick,'inconsistent clock accepted')});
document.getElementById('details').textContent=results.join('\n');document.getElementById('result').textContent=results.some(x=>x.startsWith('FAIL'))?'FAIL':results.length+' parser checks passed';
</script></html>
