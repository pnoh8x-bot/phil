<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px system-ui;width:320px;padding:14px}input{width:100%;box-sizing:border-box;margin:8px 0;padding:8px}button{margin:5px 0;padding:8px}p{line-height:1.5}</style><h3>Yahoo 브라우저 연결</h3><p>로그인된 Yahoo 농구 화면의 표만 읽습니다. 비밀번호·쿠키·API 키는 읽지 않습니다.</p><label>Yahoo 팀 주소<input id="team" placeholder="https://basketball.fantasysports.yahoo.com/nba/123/1"></label><label>드래프트 방 주소 (모의 드래프트는 필수)<input id="room" placeholder="https://basketball.fantasysports.yahoo.com/draftclient/nba/123/1"></label><button id="start">연결 시작</button><button id="stop">중지</button><p id="status"></p><p>원래 Yahoo 탭에서 선수 통계·ADP를 수집합니다. 결과 관찰용 Yahoo 탭을 하나 자동 복제하고 Results → Round by Round를 유지합니다. 관찰 탭도 닫지 마세요. Helper 수신 확인 버전이 표시되어야 전달을 확인한 것입니다. 일반 Draft Results는 15초마다 갱신합니다. 기록은 Chrome 저장소에 남습니다.</p><button id="results">드래프트 결과 열기</button><button id="players">선수 통계 열기</button><button id="adp">ADP 분석 열기</button><button id="helper">Helper 열기</button><script src="popup.js"></script></html>
