<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px system-ui;width:320px;padding:14px}input{width:100%;box-sizing:border-box;margin:8px 0;padding:8px}button{margin:5px 0;padding:8px}p{line-height:1.5}</style><h3>Yahoo 브라우저 연결</h3><p>로그인된 Yahoo 농구 화면의 표만 읽습니다. 비밀번호·쿠키·API 키는 읽지 않습니다.</p><label>Yahoo 팀 주소<input id="team" placeholder="https://basketball.fantasysports.yahoo.com/nba/123/1"></label><label>드래프트 방 주소 (모의 드래프트는 필수)<input id="room" placeholder="https://basketball.fantasysports.yahoo.com/draftclient/nba/123/1"></label><button id="start">연결 시작</button><button id="stop">중지</button><p id="status"></p><p>Yahoo 드래프트 탭은 하나만 유지하세요. 복제 접속은 Yahoo가 기존 접속을 끊습니다. 같은 탭의 Players에서 통계·ADP를 읽고 Results → Round by Round가 표시될 때 지명 기록을 수집합니다. 현재 자동 화면 전환은 하지 않습니다. 결과 화면을 떠나 45초간 새 결과를 못 읽으면 추천을 멈춥니다. Helper 수신 확인 버전은 전달 확인이며 실시간 지명 수집 완료를 뜻하지 않습니다.</p><button id="results">드래프트 결과 열기</button><button id="players">선수 통계 열기</button><button id="adp">ADP 분석 열기</button><button id="helper">Helper 열기</button><script src="popup.js"></script></html>
