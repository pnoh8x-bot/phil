<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px system-ui;width:320px;padding:14px}input{width:100%;box-sizing:border-box;margin:8px 0;padding:8px}button{margin:5px 0;padding:8px}p{line-height:1.5}</style><h3>Yahoo 브라우저 연결</h3><p>로그인된 Yahoo 농구 화면의 표만 읽습니다. 비밀번호·쿠키·API 키는 읽지 않습니다.</p><label>Yahoo 팀 주소<input id="team" placeholder="https://basketball.fantasysports.yahoo.com/nba/123/1"></label><label>드래프트 방 주소 (모의 드래프트는 필수)<input id="room" placeholder="https://basketball.fantasysports.yahoo.com/draftclient/nba/123/1"></label><button id="start">연결 시작</button><button id="stop">중지</button><p id="status"></p><p>선수 화면에서 통계·ADP를 수집합니다. 지명 자동 반영은 드래프트의 Results → Round by Round를 열어두세요. 다른 화면에서는 마지막 결과 수신 시점이 표시됩니다. 일반 Draft Results 페이지는 15초마다 갱신합니다.</p><button id="results">드래프트 결과 열기</button><button id="players">선수 통계 열기</button><button id="adp">ADP 분석 열기</button><button id="helper">Helper 열기</button><script src="popup.js"></script></html>
